name: grad site inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python committee/grad-facilitator/tools/crawl-grad-site.py
      - name: commit results
        run: |
          git config user.name "Ines Thiebaut"
          git config user.email "ines.thiebaut@csueastbay.edu"
          git add committee/grad-facilitator/documents/grad-site-inventory.tsv committee/grad-facilitator/documents/grad-site-overlap.tsv
          git diff --cached --quiet || git commit -m "record Graduate Studies section inventory"
          git push
